<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-labelledby="title">
  <title id="title">Campus Event Hub logo</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <g fill="none" fill-rule="evenodd">
    <rect width="48" height="48" x="0" y="8" rx="8" fill="url(#g)"/>
    <g transform="translate(6,16)" fill="#fff">
      <rect x="4" y="0" width="24" height="4" rx="2"/>
      <rect x="0" y="8" width="32" height="4" rx="2"/>
      <rect x="6" y="16" width="20" height="4" rx="2"/>
    </g>
    <text x="64" y="40" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2b1346" font-weight="700">Campus Event Hub</text>
  </g>
